<!DOCTYPE html>
<html>
<head>
<title>Login - Expense Tracker</title>

<style>
body{
  background:#0a0a0f;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.login-box{
  background:#1c1c2a;
  padding:30px;
  border-radius:10px;
  width:320px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#7c5cfc;
  border:none;
  color:white;
  cursor:pointer;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Login</h2>

<input type="text" id="name" placeholder="Username">
<input type="email" id="email" placeholder="Email">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase(); // ✅ FIX

  if(!name || !email){
    alert("Enter username and email");
    return;
  }

  const user = {
    name: name,
    email: email
  };

  localStorage.setItem("currentUser", JSON.stringify(user));

  window.location.href = "expense.html";
}

</script>

</body>
</html>
